# StepClusterIssuer — integra cert-manager com Step-CA
# Requer: helm install step-issuer smallstep/step-issuer
---
apiVersion: certmanager.step.sm/v1beta1
kind: StepClusterIssuer
metadata:
  name: step-ca-issuer
spec:
  url: https://step-ca-svc.pki-system.svc.cluster.local:9000
  caBundle: Cg==  # base64 do CA bundle (preenchido pelo script bootstrap)
  provisioner:
    name: cert-manager
    kid: ""         # preenchido pelo script setup-ca.sh
    passwordRef:
      name: step-ca-provisioner-password
      namespace: pki-system
      key: password
---
# ClusterIssuer para certificados internos (ingress, serviços)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca-internal
spec:
  acme:
    server: https://step-ca-svc.pki-system.svc.cluster.local:9000/acme/acme/directory
    privateKeySecretRef:
      name: step-ca-internal-key
    solvers:
      - http01:
          ingress:
            class: nginx
