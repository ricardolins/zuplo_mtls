# StepClusterIssuer — integrates cert-manager with Step-CA
# Requires: helm install step-issuer smallstep/step-issuer
---
apiVersion: certmanager.step.sm/v1beta1
kind: StepClusterIssuer
metadata:
  name: step-ca-issuer
spec:
  url: https://step-ca-svc.pki-system.svc.cluster.local:9000
  caBundle: Cg==  # base64 of CA bundle (filled by bootstrap script)
  provisioner:
    name: cert-manager
    kid: ""         # filled by setup-ca.sh
    passwordRef:
      name: step-ca-provisioner-password
      namespace: pki-system
      key: password
---
# ClusterIssuer for internal certificates (ingress, services)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca-internal
spec:
  acme:
    server: https://step-ca-svc.pki-system.svc.cluster.local:9000/acme/acme/directory
    privateKeySecretRef:
      name: step-ca-internal-key
    solvers:
      - http01:
          ingress:
            class: nginx
