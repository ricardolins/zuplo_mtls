# Helm values for cert-manager v1.14+
# Chart: jetstack/cert-manager

installCRDs: true

replicaCount: 2

# Pin to PKI nodes (dedicated pool)
nodeSelector:
  role: pki

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "pki"
    effect: "NoSchedule"

# Prometheus metrics
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    namespace: monitoring

# Webhook HA
webhook:
  replicaCount: 2
  nodeSelector:
    role: pki
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "pki"
      effect: "NoSchedule"

cainjector:
  replicaCount: 2
  nodeSelector:
    role: pki
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "pki"
      effect: "NoSchedule"

# Enable OCSP and CRL in managed certificates
featureGates: "AdditionalCertificateOutputFormats=true"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
