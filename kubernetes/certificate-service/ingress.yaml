apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: certificate-service-ingress
  namespace: certificate-service
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "step-ca-internal"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"

    # IP whitelist — only your IP can reach this service
    nginx.ingress.kubernetes.io/whitelist-source-range: "177.181.2.218/32"

    # Rate limiting per IP
    nginx.ingress.kubernetes.io/rate-limit: "60"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"

    # mTLS: optional so API Key bootstrap calls pass through without cert
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "optional"
    nginx.ingress.kubernetes.io/auth-tls-secret: "pki-system/step-ca-root-cert"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "2"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
spec:
  tls:
    - hosts:
        - certs.ricardolins.dev.br
      secretName: certificate-service-tls
  rules:
    - host: certs.ricardolins.dev.br
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: certificate-service-svc
                port:
                  number: 80
