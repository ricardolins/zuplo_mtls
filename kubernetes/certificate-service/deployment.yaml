apiVersion: apps/v1
kind: Deployment
metadata:
  name: certificate-service
  namespace: certificate-service
  labels:
    app: certificate-service
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: certificate-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: certificate-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        role: app
      serviceAccountName: certificate-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
        - name: certificate-service
          image: your-registry/certificate-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: STEP_CA_URL
              value: "https://step-ca-svc.pki-system.svc.cluster.local:9000"
            - name: STEP_CA_FINGERPRINT
              valueFrom:
                configMapKeyRef:
                  name: certificate-service-config
                  key: step_ca_fingerprint
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: certificate-service-secrets
                  key: database_url
            - name: PROVISIONER_NAME
              value: "cert-manager"
            - name: DEFAULT_CERT_TTL
              value: "2160h"
          volumeMounts:
            - name: step-ca-root
              mountPath: /etc/ssl/step
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: step-ca-root
          secret:
            secretName: step-ca-root-cert
            items:
              - key: root_ca.crt
                path: root_ca.crt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: certificate-service-sa
  namespace: certificate-service
---
apiVersion: v1
kind: Service
metadata:
  name: certificate-service-svc
  namespace: certificate-service
spec:
  type: ClusterIP
  selector:
    app: certificate-service
  ports:
    - name: http
      port: 80
      targetPort: 3000
    - name: metrics
      port: 3001
      targetPort: 3001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: certificate-service-hpa
  namespace: certificate-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: certificate-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
