---
apiVersion: v1
kind: Service
metadata:
  name: step-ca-svc
  namespace: pki-system
  labels:
    app: step-ca
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
spec:
  type: ClusterIP
  selector:
    app: step-ca
  ports:
    - name: ca-api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: ocsp
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP
