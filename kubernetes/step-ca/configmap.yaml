apiVersion: v1
kind: ConfigMap
metadata:
  name: step-ca-config
  namespace: pki-system
data:
  ca.json: |
    {
      "root": "/home/step/certs/root_ca.crt",
      "federatedRoots": [],
      "crt": "/home/step/certs/intermediate_ca.crt",
      "key": "/home/step/secrets/intermediate_ca_key",
      "address": ":9000",
      "insecureAddress": "",
      "dnsNames": [
        "step-ca-svc",
        "step-ca-svc.pki-system",
        "step-ca-svc.pki-system.svc.cluster.local",
        "ca.baas.io"
      ],
      "logger": {
        "format": "json"
      },
      "db": {
        "type": "badgerV2",
        "dataSource": "/home/step/db"
      },
      "authority": {
        "provisioners": [
          {
            "type": "JWK",
            "name": "cert-manager",
            "key": {
              "use": "sig",
              "kty": "EC",
              "kid": "PLACEHOLDER_KID",
              "crv": "P-256",
              "alg": "ES256",
              "x": "PLACEHOLDER_X",
              "y": "PLACEHOLDER_Y"
            },
            "encryptedKey": "PLACEHOLDER_ENCRYPTED_KEY",
            "claims": {
              "minTLSDur": "5m",
              "maxTLSDur": "2160h",
              "defaultTLSDur": "2160h"
            }
          },
          {
            "type": "ACME",
            "name": "acme"
          }
        ]
      },
      "tls": {
        "cipherSuites": [
          "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256",
          "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256"
        ],
        "minVersion": 1.2,
        "maxVersion": 1.3,
        "renegotiation": false
      },
      "crl": {
        "enabled": true,
        "generateOnRevoke": true,
        "cacheDuration": "24h",
        "renewBefore": "6h"
      }
    }
