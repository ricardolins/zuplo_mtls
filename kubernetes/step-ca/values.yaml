# Helm values for Step-CA (smallstep/step-certificates)
# Chart: smallstep/step-certificates

ca:
  name: "BaaS mTLS Root CA"
  address: ":9000"
  dns:
    - step-ca-svc
    - step-ca-svc.pki-system
    - step-ca-svc.pki-system.svc.cluster.local
    - ca.baas.io
  db:
    type: badgerV2
    dataSource: /home/step/db

# Configured provisioners
provisioners:
  # JWK for use by cert-manager
  - name: cert-manager
    type: JWK
    options:
      minTLSDur: 5m
      maxTLSDur: 90d
      defaultTLSDur: 90d

  # ACME for automatic renewal
  - name: acme
    type: ACME

  # x5c for issuance with client certificate
  - name: x5c-provisioner
    type: X5C
    options:
      roots: []  # filled with Root CA cert during setup

# Persistence
persistence:
  enabled: true
  storageClass: "linode-block-storage-retain"
  size: 10Gi
  accessModes:
    - ReadWriteOnce

# Pin to PKI nodes
nodeSelector:
  role: pki

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "pki"
    effect: "NoSchedule"

# HA: 2 replicas (step-ca supports via shared storage)
replicaCount: 2

# Resources for cryptographic operations
resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 1Gi

service:
  type: ClusterIP
  port: 9000
  targetPort: 9000

ocsp:
  enabled: true
  port: 8080

crl:
  enabled: true
  cacheDuration: 24h
  renewBefore: 6h

metrics:
  enabled: true
  path: /metrics
  port: 9100

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
