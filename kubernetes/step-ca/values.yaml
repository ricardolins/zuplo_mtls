# Helm values for Step-CA (smallstep/step-certificates)
# Chart: smallstep/step-certificates

ca:
  name: "BaaS mTLS Root CA"
  address: ":9000"
  dns: "step-ca-svc,step-ca-svc.pki-system,step-ca-svc.pki-system.svc.cluster.local,ca.ricardolins.dev.br"
  db:
    enabled: true
    persistent: false

# Dev/test: single node
nodeSelector:
  role: pki

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "pki"
    effect: "NoSchedule"

replicaCount: 1

resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

service:
  type: ClusterIP
  port: 9000
  targetPort: 9000

metrics:
  enabled: true
  path: /metrics
  port: 9100
